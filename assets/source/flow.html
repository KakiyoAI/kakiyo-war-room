<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  #canvas { width: 1600px; padding: 56px 64px 56px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 34px; }
  .top h2 { font-family: "Cal Sans", sans-serif; font-weight: 400; font-size: 40px; letter-spacing: -.02em; }
  .top .sub { color: var(--muted); font-size: 18px; }

  .cols { display: grid; grid-template-columns: 1fr 64px 1fr 64px 1fr; align-items: stretch; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .colhead { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
  .colhead i { width: 8px; height: 8px; border-radius: 99px; background: var(--blue); display: block; }
  .colhead.you i { background: var(--ink); }

  .step { display: grid; grid-template-columns: 44px 1fr; gap: 16px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); }
  .step .ib { width: 44px; height: 44px; border-radius: 12px; background: var(--blue-soft); border: 1px solid var(--blue-line); color: var(--blue); display: grid; place-items: center; }
  .step .ib .ico { width: 22px; height: 22px; }
  .step .n { font: 600 12px "Inter"; letter-spacing: .08em; color: var(--faint); }
  .step h4 { font-family: "Cal Sans", sans-serif; font-weight: 400; font-size: 22px; letter-spacing: -.01em; line-height: 1.15; }
  .step p { font-size: 15.5px; line-height: 1.45; color: var(--muted); margin-top: 4px; }

  .gate { border-radius: 18px; border: 2px solid var(--ink); background: var(--card); padding: 22px 22px; display: grid; grid-template-columns: 52px 1fr; gap: 16px; align-items: center; position: relative; }
  .gate .ib { width: 52px; height: 52px; border-radius: 14px; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
  .gate .ib .ico { width: 26px; height: 26px; }
  .gate h4 { font-family: "Cal Sans", sans-serif; font-weight: 400; font-size: 26px; letter-spacing: -.01em; }
  .gate p { font-size: 15.5px; line-height: 1.45; color: var(--muted); margin-top: 4px; }
  .gate p b { color: var(--ink); font-weight: 600; }

  .ai { border-radius: 18px; background: #2563eb; color: #fff; padding: 24px 24px 22px; position: relative; overflow: hidden; }
  .ai::after { content: ""; position: absolute; right: -40px; top: -40px; width: 220px; height: 220px; background: radial-gradient(closest-side, rgba(255,255,255,.28), transparent); }
  .ai .row { display: flex; align-items: center; gap: 14px; }
  .ai svg.mark { width: 40px; height: 40px; flex: none; }
  .ai h4 { font-family: "Cal Sans", sans-serif; font-weight: 400; font-size: 26px; letter-spacing: -.01em; }
  .ai p { font-size: 15.5px; line-height: 1.5; margin-top: 12px; color: rgba(255,255,255,.88); position: relative; z-index: 1; }
  .ai .pill { display: inline-block; margin-top: 14px; font: 600 12px "Inter"; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.18); position: relative; z-index: 1; }

  .back { border-radius: 18px; border: 1.5px dashed var(--border); padding: 22px 24px; flex: 1; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
  .back h5 { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
  .back li { list-style: none; display: grid; grid-template-columns: 22px 1fr; gap: 12px; font-size: 16px; line-height: 1.45; color: var(--muted); }
  .back li svg { width: 20px; height: 20px; stroke: var(--blue); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-top: 2px; }
  .back li b { color: var(--ink); font-weight: 600; }
  .arrow { display: grid; place-items: center; color: var(--faint); }
  .arrow svg { width: 40px; height: 40px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .loop { margin-top: 22px; display: flex; align-items: center; gap: 14px; padding: 16px 22px; border-radius: 14px; border: 1.5px dashed var(--blue-line); background: var(--blue-soft); color: var(--muted); font-size: 16.5px; }
  .loop svg { width: 22px; height: 22px; stroke: var(--blue); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .loop b { color: var(--ink); font-weight: 600; }
</style></head>
<body>
<div id="canvas">
  <div class="top"><h2>From “who should we reach?” to “what worked?”</h2><span class="sub">The team works before and after launch. Your AI works in the middle.</span></div>

  <div class="cols" id="cols"></div>

  <div class="loop"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg><span><b>It's a loop.</b> What the Analyst and Inbox Watch find goes back into the next list and the next prompt change.</span></div>
</div>

<script>
document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'light';
const I = {
  compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><circle cx="11.5" cy="14.5" r="2.5"/><path d="M13.3 16.3 15 18"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  chart: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  key: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
};
const svg = k => `<svg class="ico" viewBox="0 0 24 24">${I[k]}</svg>`;
const step = (n, ic, name, d) => `<div class="step"><div class="ib">${svg(ic)}</div><div><div class="n">${n}</div><h4>${name}</h4><p>${d}</p></div></div>`;
const arrow = `<div class="arrow"><svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></div>`;
const mark = `<svg class="mark" viewBox="0 0 1000 1000"><g fill="#fff"><polygon points="590.63 592.05 814.12 660.89 841.32 579.31 589.13 500.41 837.97 424.15 810.76 342.59 589.13 409.44 738.7 259.88 677.89 199.07 376.97 500 677.89 800.92 738.7 740.12 590.63 592.05"/><polygon points="342.54 432.49 178.63 382 158.68 441.83 343.63 499.7 161.13 555.63 181.09 615.44 343.63 566.42 233.94 676.11 278.54 720.7 499.24 500 278.54 279.3 233.94 323.89 342.54 432.49"/></g></svg>`;

document.getElementById('cols').innerHTML = `
  <div class="col"><div class="colhead"><i></i>Before launch · War Room</div>
    ${step('01', 'compass', 'Strategist', 'Who to target and why now.')}
    ${step('02', 'search', 'Scout', 'Finds leads, filters bad fits.')}
    ${step('03', 'file', 'Intel', 'Adds a sourced “why now” to each lead.')}
    ${step('04', 'pen', 'Playbook Writer', 'Checks the prompt fits this audience.')}
  </div>
  ${arrow}
  <div class="col"><div class="colhead you"><i></i>Launch · you decide</div>
    ${step('05', 'send', 'Launch Operator', 'Pre-flight: profile, credits, limits.')}
    <div class="gate"><div class="ib">${svg('key')}</div><div><h4>You say yes</h4><p>The campaign is staged <b>paused</b>. It only goes live when you approve.</p></div></div>
    <div class="ai"><div class="row">${mark}<h4>Kakiyo's AI</h4></div><p>Sends invitations, reads each profile, writes the first message, replies, follows up and qualifies, on the LinkedIn profile's own schedule.</p><span class="pill">Does the talking</span></div>
  </div>
  ${arrow}
  <div class="col"><div class="colhead"><i></i>After launch · War Room</div>
    ${step('06', 'inbox', 'Inbox Watch', 'Flags hot leads and AI mistakes. You take over.')}
    ${step('07', 'chart', 'Analyst', 'Funnel, rates and the one change to make.')}
    <div class="back"><h5>What you get back</h5><ul style="display:flex;flex-direction:column;gap:12px;padding:0">
      <li><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span><b>Hot leads</b> to take over, with their own words quoted</span></li>
      <li><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span><b>Prompt problems</b> your AI got wrong, with the lines to fix</span></li>
      <li><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span><b>Where the funnel leaks</b> and who should fix it</span></li>
    </ul></div>
  </div>`;
</script>
</body></html>
